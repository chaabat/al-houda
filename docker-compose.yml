# Site statique Next.js de la mosquée Al-Houda.
#   Développement : docker compose up            → http://localhost:3000/fr
#   Production    : docker compose --profile prod up -d --build site   → http://localhost:8080/fr

services:
  
  web:
    build:
      context: .
      target: dev
    container_name: alhouda-web
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"

  site:
    profiles: ["prod"]
    build:
      context: .
      target: prod
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
    container_name: alhouda-site
    restart: unless-stopped
    ports:
      - "8080:80"
